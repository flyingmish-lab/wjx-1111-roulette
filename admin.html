
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WJX — Админ-панель</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f1eb;
      font-family: Arial, sans-serif;
      color: #29202a;
    }

    .panel {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      color: #991b32;
      text-align: center;
      font-size: 26px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin: 16px 0;
      box-shadow: 0 3px 12px #00000012;
    }

    h2 { font-size: 18px; }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5c9c9;
      border-radius: 9px;
      font-size: 16px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle input { width: 24px; height: 24px; }

    button {
      width: 100%;
      padding: 15px;
      background: #991b32;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      color: #786d73;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>⚙️ WJX Админ-панель</h1>

    <div class="card">
      <h2>📅 Даты розыгрыша</h2>

      <label for="startDate">Дата начала</label>
      <input id="startDate" type="date" value="2026-11-26">

      <label for="endDate">Дата окончания</label>
      <input id="endDate" type="date" value="2026-11-28">
      <label for="startTime">🕙 Время начала (МСК)</label>
<input id="startTime" type="time" value="10:00">

<label for="endTime">🕛 Время окончания (МСК)</label>
<input id="endTime" type="time" value="23:59">
    </div>

    <div class="card">
      <h2>🎰 Настройки рулетки</h2>

      <label for="dailySpins">Прокруток в день</label>
      <input id="dailySpins" type="number" min="1" max="20" value="3">

      <div class="toggle">
        <label for="testMode">🧪 Тестовый режим</label>
        <input id="testMode" type="checkbox">
      </div>
    </div>

<div
  id="prizeChancesEditor"
  style="margin-bottom:20px; text-align:left;"
>
  <h3>🎯 Настройка вероятностей призов</h3>
  <div id="prizeChancesFields"></div>
  <p id="prizeChancesTotal">Итого: —</p>
  <button id="savePrizeChancesButton" type="button">
    💾 Сохранить вероятности
  </button>
</div>
<button
  id="viewPrizesButton"
  type="button"
  style="margin-bottom: 15px;"
>
  🎁 Призы и выигрыши
</button>
  <div
  id="prizesPanel"
  style="display:none; margin-bottom:20px; text-align:left;"
></div>
    <div
  id="winsHistory"
  style="display:none; margin-bottom:20px; text-align:left;"
></div>
    <button
  id="resetTestSpinsButton"
  type="button"
  style="margin-bottom: 15px;"
>
  🔄 Сбросить тестовые прокрутки
</button>
    <button id="saveButton" type="button" disabled>
      💾 Сохранить настройки
    </button>

<p class="note">
  ⚙️ Настройки сохраняются в Supabase.
  Управление доступно только администратору через Telegram.
</p>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
  const telegram = window.Telegram?.WebApp;
    const adminInitData =
  telegram?.initData ||
  sessionStorage.getItem("wjxAdminInitData") ||
  "";
  telegram?.ready();

  const apiUrl = "https://xfslymkzlzfsrzaoerpn.supabase.co/functions/v1/wjx-roulette";
    async function loadSettings() {
  if (!adminInitData) {
    alert("Открой админ-панель через Telegram.");
    return;
  }

  try {
    const response = await fetch(apiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "admin_get_settings",
        initData: adminInitData
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Не удалось загрузить настройки");
    }

    document.getElementById("startDate").value = result.settings.event_start;
    document.getElementById("endDate").value = result.settings.event_end;
    document.getElementById("startTime").value =
  result.settings.start_time || "10:00";

   document.getElementById("endTime").value =
  result.settings.end_time || "23:59";
    document.getElementById("dailySpins").value = result.settings.daily_spins;
    document.getElementById("testMode").checked = result.settings.test_mode;

    document.getElementById("saveButton").disabled = false;
  } catch (error) {
    alert("Ошибка: " + error.message);
  }
}
    async function loadPrizes() {
  const panel = document.getElementById("prizesPanel");
  panel.textContent = "⏳ Загружаем призы...";

  try {
    const response = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "admin_get_prizes",
        initData: adminInitData
      })
    });

    const result = await response.json();
    if (response.ok && result.success) {
  window.currentPrizeChances = result.prizes.map((item) => ({
    prize: item.prize,
    chance: Number(item.chance)
  }));
}
    const fields = document.getElementById("prizeChancesFields");
fields.textContent = "";

for (const item of window.currentPrizeChances ?? []) {
  const label = document.createElement("label");
  label.textContent = item.prize + ": ";
  label.style.display = "block";
  label.style.marginBottom = "10px";

  const input = document.createElement("input");
  input.type = "number";
  input.min = "0";
  input.max = "100";
  input.step = "0.01";
  input.value = item.chance;
  input.dataset.prize = item.prize;
  input.className = "prizeChanceInput";
  input.style.width = "80px";

  label.appendChild(input);
  label.append(" %");
  fields.appendChild(label);
}
  function updatePrizeChancesTotal() {
  const inputs = document.querySelectorAll(".prizeChanceInput");

  let total = 0;

  for (const input of inputs) {
    total += Number(input.value) || 0;
  }

  const totalElement = document.getElementById("prizeChancesTotal");
  totalElement.textContent = `Итого: ${total.toFixed(2)}%`;

  totalElement.style.color =
    Math.abs(total - 100) < 0.001 ? "green" : "red";
}

document.querySelectorAll(".prizeChanceInput").forEach((input) => {
  input.addEventListener("input", updatePrizeChancesTotal);
});

updatePrizeChancesTotal();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Ошибка загрузки призов");
    }

    panel.textContent = "";
const historyPanel = document.getElementById("winsHistory");
historyPanel.textContent = "";
const historyTitle = document.createElement("h3");
historyTitle.textContent = "📋 История последних 50 прокруток";
historyPanel.appendChild(historyTitle);

for (const spin of result.history ?? []) {
  const line = document.createElement("p");

  const name = spin.username
    ? `@${spin.username}`
    : spin.first_name;

  line.textContent =
    `👤 ${name} | 📅 ${spin.spin_date} | 🎁 ${spin.prize ?? "Без выигрыша"}`;

  historyPanel.appendChild(line);
}
    for (const item of result.prizes) {
      const line = document.createElement("p");
      line.textContent =
        `${item.prize} — шанс ${item.chance}% | ` +
        `Выигрышей: ${item.realWins} | ` +
        `Тестовых: ${item.testWins}`;
      panel.appendChild(line);
    }
  } catch (error) {
    panel.textContent = "❌ " + error.message;
  }
}
    async function resetTestSpins() {
  if (!confirm("Сбросить сегодняшние тестовые прокрутки?")) return;

  try {
    const response = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "admin_reset_test_spins",
        initData: adminInitData
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Ошибка сброса");
    }

    alert("✅ Тестовые прокрутки сброшены!");
  } catch (error) {
    alert("❌ " + error.message);
  }
}
    async function saveSettings() {
  const button = document.getElementById("saveButton");
  button.disabled = true;

  try {
    const response = await fetch(apiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "admin_save_settings",
        initData: adminInitData,
        settings: {
          event_start: document.getElementById("startDate").value,
          event_end: document.getElementById("endDate").value,
          start_time: document.getElementById("startTime").value,
          end_time: document.getElementById("endTime").value,
          daily_spins: Number(document.getElementById("dailySpins").value),
          test_mode: document.getElementById("testMode").checked
        }
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Не удалось сохранить настройки");
    }

    alert("✅ Настройки сохранены!");
  } catch (error) {
    alert("Ошибка: " + error.message);
  } finally {
    button.disabled = false;
  }
}
document.getElementById("savePrizeChancesButton").addEventListener("click", async () => {
  const inputs = document.querySelectorAll(".prizeChanceInput");

  const prizes = Array.from(inputs).map((input) => ({
    prize: input.dataset.prize,
    chance: Number(input.value)
  }));

  const total = prizes.reduce((sum, item) => sum + item.chance, 0);

  if (
  inputs.length !== 6 ||
  Array.from(inputs).some((input) => input.value.trim() === "") ||
  prizes.some((item) =>
    !Number.isFinite(item.chance) ||
    item.chance < 0 ||
    item.chance > 100
  ) ||
  Math.abs(total - 100) > 0.001
) {
    alert("❌ Сумма вероятностей должна быть ровно 100%!");
    return;
  }

    try {
    const response = await fetch(apiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "admin_save_prize_chances",
        initData: adminInitData,
        prizes: prizes
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Не удалось сохранить вероятности");
    }

    alert("✅ Вероятности успешно сохранены!");
  } catch (error) {
    alert("❌ " + error.message);
  }
});
document.getElementById("saveButton").addEventListener("click", saveSettings);
document.getElementById("resetTestSpinsButton").addEventListener("click", resetTestSpins);
document.getElementById("viewPrizesButton").addEventListener("click", async () => {
  const panel = document.getElementById("prizesPanel");
  const historyPanel = document.getElementById("winsHistory");

  if (panel.style.display === "none") {
  panel.style.display = "block";
  historyPanel.style.display = "block";
  await loadPrizes();
} else {
  panel.style.display = "none";
  historyPanel.style.display = "none";
}
});
loadSettings();
loadPrizes();
</script> 
  
</body>
</html>
