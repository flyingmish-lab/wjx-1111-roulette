
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WJX 11.11 — Рулетка подарков</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #173b66;
    background: linear-gradient(
      160deg, #8bd4ff 0%, #c7eaff 48%, #f3f7ff 100%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .cloud {
    position: fixed;
    width: 260px;
    height: 85px;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    filter: blur(25px);
    pointer-events: none;
  }

  .cloud.one { top: 12%; left: -90px; }
  .cloud.two { bottom: 15%; right: -100px; }

  .app {
    position: relative;
    width: min(100%, 440px);
    padding: 32px 20px 40px;
    text-align: center;
  }

  .eyebrow {
    letter-spacing: 4px;
    font-size: 12px;
    font-weight: bold;
    color: #5278a2;
  }

  h1 {
    font-size: clamp(44px, 12vw, 66px);
    margin: 10px 0 0;
    color: #fff;
    text-shadow:
      0 3px 0 #578dc6,
      0 7px 20px rgba(38,93,164,.35);
  }

  .subtitle {
    margin: 8px 0 30px;
    font-size: 18px;
    font-weight: bold;
  }

  .machine {
    padding: 22px 16px 25px;
    border: 3px solid #f6d891;
    border-radius: 32px;
    background: linear-gradient(145deg, #4e9bd9, #2866b1);
    box-shadow:
      0 18px 40px rgba(30,78,143,.25),
      inset 0 3px 12px rgba(255,255,255,.3);
  }

  .machine-title {
    color: #fff4c6;
    font-weight: bold;
    letter-spacing: 2px;
    font-size: 14px;
    margin-bottom: 18px;
  }

  .reels {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 9px;
    padding: 10px;
    border-radius: 20px;
    background: #194e8b;
  }

  .reel {
    position: relative;
    height: 130px;
    overflow: hidden;
    border-radius: 13px;
    background: linear-gradient(#fff, #e9f5ff 55%, #fff);
    box-shadow: inset 0 0 10px #b3d7f1;
  }

  .reel::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(26,75,130,.18),
      transparent 32%,
      transparent 68%,
      rgba(26,75,130,.18)
    );
  }

  .reel-strip {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    will-change: transform;
  }

  .symbol {
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(36px, 10vw, 52px);
    user-select: none;
  }

  .spin {
    display: block;
    margin-top: 24px;
    width: 100%;
    min-height: 60px;
    border: 2px solid #fff0bf;
    border-radius: 50px;
    padding: 17px 12px;
    font-size: 18px;
    font-weight: bold;
    color: #62420b;
    background: linear-gradient(#ffe8a1, #f5b94d);
    box-shadow: 0 6px 0 #bb832d;
    cursor: pointer;
    font-family: inherit;
  }

  .spin:disabled {
    opacity: 1;
    color: #62420b;
    cursor: wait;
  }

  .spin:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #bb832d;
  }

  .note {
    margin-top: 25px;
    font-size: 13px;
    line-height: 1.6;
    color: #5278a2;
  }

  .stars {
    color: #f7d078;
    letter-spacing: 12px;
    margin-bottom: 12px;
  }

  @media (max-width: 360px) {
    .reel, .symbol { height: 110px; }
    .machine { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>

<body>
<div class="cloud one"></div>
<div class="cloud two"></div>

<main class="app">
  <div class="stars">✦ ✧ ✦</div>
  <div class="eyebrow">ПРАЗДНИЧНАЯ АКЦИЯ</div>

  <h1>WJX 11.11</h1>
  <div class="subtitle">Рулетка подарков 🎁</div>

  <section class="machine">
    <div class="machine-title">✦ ПОЙМАЙ СВОЮ УДАЧУ ✦</div>

    <div class="reels">
      <div class="reel"><div class="reel-strip"></div></div>
      <div class="reel"><div class="reel-strip"></div></div>
      <div class="reel"><div class="reel-strip"></div></div>
    </div>

    <button class="spin" type="button" id="spinButton">
      🎰 КРУТИТЬ БАРАБАНЫ
    </button>
  </section>

  <p class="note">
    Демонстрация анимации — призы пока не разыгрываются.<br>
    WJX 11.11 — подарки уже близко!
  </p>
</main>

<script>
  const reels = [...document.querySelectorAll(".reel")];
  const button = document.getElementById("spinButton");
  const symbols = ["Глянцевая упаковка WJX с картриджами.png", "🎁", "✨", "💎", "⭐", "🎀"];
  const animations = [];
  let spinning = false;

  const getHeight = reel => reel.clientHeight;

 
function makeSymbol(value, height) {
  const item = document.createElement("div");
  item.className = "symbol";
  item.style.height = height + "px";

  if (value.endsWith(".png")) {
    const img = document.createElement("img");
    img.src = encodeURI(value);
    img.alt = "Упаковка картриджей WJX";
    img.style.width = "85%";
    img.style.height = "90%";
    img.style.objectFit = "contain";
    item.appendChild(img);
  } else {
    item.textContent = value;
  }

  return item;
}

  function randomSymbol() {
    return symbols[Math.floor(Math.random() * symbols.length)];
  }

  function setInitialReel(reel) {
    const strip = reel.querySelector(".reel-strip");
    strip.replaceChildren(makeSymbol(randomSymbol(), getHeight(reel)));
    strip.style.transform = "translateY(0)";
  }

  reels.forEach(setInitialReel);

  async function spinReel(reel, index) {
    const strip = reel.querySelector(".reel-strip");
    const height = getHeight(reel);
    const count = 28 + index * 7;
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < count; i++) {
      fragment.appendChild(makeSymbol(randomSymbol(), height));
    }

    strip.replaceChildren(fragment);

    const distance = (count - 1) * height;
    const duration = 2300 + index * 650;
   
   strip.style.transform = `translateY(-${distance}px)`;
   
    const animation = strip.animate(
      [
        { transform: `translateY(-${distance}px)` },
        { transform:  "translateY(0)" }
      ],
      {
        duration,
        easing: "cubic-bezier(0.16, 0.72, 0.22, 1)",
        fill: "forwards"
      }
    );

    animations.push(animation);

    try {
      await animation.finished;
    } catch {
      return;
    }

   
const firstItem = strip.firstElementChild;
const finalImage = firstItem.querySelector("img");

const finalSymbol = finalImage
  ? decodeURI(new URL(finalImage.src).pathname.split("/").pop())
  : firstItem.textContent;

animation.cancel();
strip.replaceChildren(makeSymbol(finalSymbol, height));
    strip.style.transform = "translateY(0)";
  }

  button.addEventListener("click", async () => {
    if (spinning) return;

    spinning = true;
    button.disabled = true;
    button.textContent = "🎰 БАРАБАНЫ КРУТЯТСЯ...";

    try {
      await Promise.all(reels.map(spinReel));
    } finally {
      spinning = false;
      button.disabled = false;
      button.textContent = "🎰 КРУТИТЬ ЕЩЁ";
    }
  });
</script>
</body>
</html>
