
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WJX 11.11 — Рулетка подарков</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #173b66;
    background: linear-gradient(
      160deg, #8bd4ff 0%, #c7eaff 48%, #f3f7ff 100%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .cloud {
    position: fixed;
    width: 260px;
    height: 85px;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    filter: blur(25px);
    pointer-events: none;
  }

  .cloud.one { top: 12%; left: -90px; }
  .cloud.two { bottom: 15%; right: -100px; }

  .app {
    position: relative;
    width: min(100%, 440px);
    padding: 32px 40px 16px;
    text-align: center;
  }

  .eyebrow {
    letter-spacing: 4px;
    font-size: 12px;
    font-weight: bold;
    color: #5278a2;
  }

  h1 {
    font-size: clamp(44px, 12vw, 66px);
    margin: 10px 0 0;
    color: #fff;
    text-shadow:
      0 3px 0 #578dc6,
      0 7px 20px rgba(38,93,164,.35);
  }

  .subtitle {
    margin: 8px 0 30px;
    font-size: 18px;
    font-weight: bold;
  }

  .machine {
  padding: 22px 16px 25px;
  border: 5px solid #17131a;
  border-radius: 28px;
  background: linear-gradient(145deg, #ff4545, #c7192c);
  box-shadow:
    0 8px 0 #7d1420,
    0 18px 35px rgba(55, 18, 30, .25),
    inset 0 4px 0 rgba(255, 255, 255, .45);
  }

  .machine-title {
  color: #fff0d0;
  font-weight: 900;
  letter-spacing: 1.5px;
  font-size: 15px;
  margin-bottom: 20px;
  text-shadow:
    2px 2px 0 #691624,
    -1px -1px 0 #691624;
  }

  .reels {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  padding: 10px;
  border: 4px solid #17131a;
  border-radius: 18px;
  background: #fff0d6;
  box-shadow:
    0 5px 0 #861a25,
    inset 0 3px 8px rgba(77, 32, 22, .2);
  }

 .reel {
  position: relative;
  height: 130px;
  overflow: hidden;
  border: 2px solid #29212a;
  border-radius: 10px;
  background: linear-gradient(
    #f7e9d0 0%,
    #fffdf5 30%,
    #fffdf5 70%,
    #f7e9d0 100%
  );
  box-shadow:
    inset 0 3px 8px rgba(55, 30, 20, .15),
    0 2px 0 rgba(255, 255, 255, .6);
  }

  .reel::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(26,75,130,.18),
      transparent 32%,
      transparent 68%,
      rgba(26,75,130,.18)
    );
  }

  .reel-strip {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    will-change: transform;
  }

  .symbol {
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(36px, 10vw, 52px);
    user-select: none;
  }

  .spin {
    display: block;
    margin-top: 24px;
    width: 100%;
    min-height: 60px;
    border: 2px solid #fff0bf;
    border-radius: 50px;
    padding: 17px 12px;
    font-size: 18px;
    font-weight: bold;
    color: #62420b;
    background: linear-gradient(#ffe8a1, #f5b94d);
    box-shadow: 0 6px 0 #bb832d;
    cursor: pointer;
    font-family: inherit;
  }

  .spin:disabled {
    opacity: 1;
    color: #62420b;
    cursor: wait;
  }

  .spin:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #bb832d;
  }

  .note {
    margin-top: 25px;
    font-size: 13px;
    line-height: 1.6;
    color: #5278a2;
  }

  .stars {
    color: #f7d078;
    letter-spacing: 12px;
    margin-bottom: 12px;
  }

  @media (max-width: 360px) {
    .reel, .symbol { height: 110px; }
    .machine { padding-left: 12px; padding-right: 12px; }
  }
 
.prize-window {
  margin-top: 24px;
  padding: 12px;
  border: 4px solid #211820;
  border-radius: 16px;
  background: #fff0d6;
  box-shadow: 0 5px 0 #861a25;
}

.prize-label {
  color: #a41d2b;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.prize-result {
  min-height: 48px;
  padding: 12px 8px;
  border: 2px solid #d7aa83;
  border-radius: 10px;
  background: #fffaf0;
  color: #38242a;
  font-size: 16px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
}

.machine {
  position: relative;
}

.lever {
  position: absolute;
  right: -18px;
  top: 85px;
  width: 34px;
  height: 120px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  z-index: 5;
}

.lever-ball {
  position: absolute;
  top: 0;
  left: 0;
  width: 34px;
  height: 34px;
  border: 3px solid #211820;
  border-radius: 50%;
  background: #f52e3c;
  box-shadow: inset -5px -5px 0 #b51628;
  z-index: 2;
}

.lever-stick {
  position: absolute;
  top: 28px;
  left: 14px;
  width: 8px;
  height: 70px;
  border: 2px solid #211820;
  border-radius: 5px;
  background: #f7e9d0;
}

.lever-base {
  position: absolute;
  bottom: 0;
  left: 5px;
  width: 28px;
  height: 30px;
  border: 3px solid #211820;
  border-radius: 8px;
  background: #a91b2b;
}


.lever:active {
  transform: none;
}


.spin {
  display: none;
}

.lever {
  right: -28px;
  top: 75px;
  width: 48px;
  height: 145px;
  transform-origin: center bottom;
  transition: transform 0.2s ease;
}

.lever-ball {
  width: 46px;
  height: 46px;
  border: 4px solid #211820;
  background: #f52e3c;
  box-shadow:
    inset -7px -7px 0 #b51628,
    inset 5px 5px 0 #ff7777;
}

.lever-stick {
  top: 39px;
  left: 19px;
  width: 11px;
  height: 82px;
  border: 3px solid #211820;
  background: #fff0d6;
}

.lever-base {
  left: 9px;
  width: 36px;
  height: 35px;
  border: 4px solid #211820;
  background: #a91b2b;
}

.lever:active {
  transform: rotate(15deg) translateY(10px);
}





@keyframes leverPull {
  0% {
    transform: translateY(0);
  }

  40% {
    transform: translateY(18px);
  }

  65% {
    transform: translateY(18px);
  }

  100% {
    transform: translateY(0);
  }
}



.lever.pulling {
  animation: none;
}


.lever.pulling .lever-ball,
.lever.pulling .lever-stick {
  animation: leverPull 0.75s cubic-bezier(0.45, 0, 0.25, 1) both;
}




.lever.pulling {
  animation: leverPull 0.6s ease-in-out;
}

/* Рычаг: убираем боковое смещение */
.lever,
.lever:active,
.lever:focus {
  transform: none;
}

/* Основание всегда неподвижно */
.lever-base {
  transform: none;
}

/* Шарик и стержень двигаются только вертикально */
.lever-ball,
.lever-stick {
  transform: translateY(0);
  transition: none;
}

.machine-marquee {
  margin: -12px 0 20px;
  padding: 12px 8px;
  border: 4px solid #211820;
  border-radius: 18px;
  background: #fff0d6;
  box-shadow:
    0 5px 0 #861a25,
    inset 0 3px 0 #ffffff;
  text-align: center;
}

.marquee-brand {
  color: #c91d30;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 3px;
  text-shadow: 2px 2px 0 #f3b5a1;
}

.marquee-event {
  margin-top: 4px;
  color: #211820;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 2px;
}

.app > h1,
.app > .eyebrow,
.app > .subtitle,
.app > .stars {
  display: none;
}

.machine-marquee {
  position: relative;
}


.marquee-cloud {
  position: absolute;
  top: -30px;
  color: #fff0d6;
  font-size: 75px;
  line-height: 1;
  -webkit-text-stroke: 2px #211820;
  text-shadow: 4px 5px 0 #d32b39;
  pointer-events: none;
  z-index: 2;
}



.cloud-left {
  left: -30px;
}

.cloud-right {
  right: -30px;
  transform: scaleX(-1);
}


</style>
</head>

<body>
<div class="cloud one"></div>
<div class="cloud two"></div>

<main class="app">
  <div class="stars">✦ ✧ ✦</div>
  <div class="eyebrow">ПРАЗДНИЧНАЯ АКЦИЯ</div>

  <h1>WJX 11.11</h1>
  <div class="subtitle">Рулетка подарков 🎁</div>

 
<section class="machine">
 
<div class="machine-marquee">
  <span class="marquee-cloud cloud-left">☁</span>
  <span class="marquee-cloud cloud-right">☁</span>

  <div class="marquee-brand">✦ WJX ✦</div>
  <div class="marquee-event">11.11 SPECIAL EVENT</div>
</div>

  <div class="machine-title">✦ ПОЙМАЙ СВОЮ УДАЧУ ✦</div>

   

<div class="reels">
  <div class="reel"><div class="reel-strip"></div></div>
  <div class="reel"><div class="reel-strip"></div></div>
  <div class="reel"><div class="reel-strip"></div></div>
  <div class="reel"><div class="reel-strip"></div></div>
</div>

<button class="lever" id="leverButton" type="button" aria-label="Потянуть рычаг">
  <span class="lever-ball"></span>
  <span class="lever-stick"></span>
  <span class="lever-base"></span>
</button>



    <button class="spin" type="button" id="spinButton">
      🎰 КРУТИТЬ БАРАБАНЫ
    </button>
   <div class="prize-window">
  <div class="prize-label">✦ ТВОЙ ВЫИГРЫШ ✦</div>
  <div class="prize-result" id="prizeResult">
    🎁 Испытай свою удачу!
  </div>
</div>
  </section>

  <p class="note">
    Демонстрация анимации — призы пока не разыгрываются.<br>
    WJX 11.11 — подарки уже близко!
  </p>
</main>

<script>
  const reels = [...document.querySelectorAll(".reel")];
  const button = document.getElementById("spinButton");
  const lever = document.getElementById("leverButton");
  const symbols = ["Глянцевая упаковка WJX с картриджами.png", "🎁", "✨", "💎", "⭐", "🎀"];
  const animations = [];
  let spinning = false;

  const getHeight = reel => reel.clientHeight;

 
function makeSymbol(value, height) {
  const item = document.createElement("div");
  item.className = "symbol";
  item.style.height = height + "px";

  if (value.endsWith(".png")) {
    const img = document.createElement("img");
    img.src = encodeURI(value);
    img.alt = "Упаковка картриджей WJX";
    img.style.width = "95%";
    img.style.height = "75%";
    img.style.objectFit = "contain";
    item.appendChild(img);
  } else {
    item.textContent = value;
  }

  return item;
}

  function randomSymbol() {
    return symbols[Math.floor(Math.random() * symbols.length)];
  }

  function setInitialReel(reel) {
    const strip = reel.querySelector(".reel-strip");
    strip.replaceChildren(makeSymbol(randomSymbol(), getHeight(reel)));
    strip.style.transform = "translateY(0)";
  }

  reels.forEach(setInitialReel);

  async function spinReel(reel, index) {
    const strip = reel.querySelector(".reel-strip");
    const height = getHeight(reel);
    const count = 28 + index * 7;
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < count; i++) {
      fragment.appendChild(makeSymbol(randomSymbol(), height));
    }

    strip.replaceChildren(fragment);

    const distance = (count - 1) * height;
    const duration = 2300 + index * 650;
   
   strip.style.transform = `translateY(-${distance}px)`;
   
    const animation = strip.animate(
      [
        { transform: `translateY(-${distance}px)` },
        { transform:  "translateY(0)" }
      ],
      {
        duration,
        easing: "cubic-bezier(0.16, 0.72, 0.22, 1)",
        fill: "forwards"
      }
    );

    animations.push(animation);

    try {
      await animation.finished;
    } catch {
      return;
    }

   
const firstItem = strip.firstElementChild;
const finalImage = firstItem.querySelector("img");

const finalSymbol = finalImage
  ? decodeURI(new URL(finalImage.src).pathname.split("/").pop())
  : firstItem.textContent;

animation.cancel();
strip.replaceChildren(makeSymbol(finalSymbol, height));
    strip.style.transform = "translateY(0)";
  }

  button.addEventListener("click", async () => {
    if (spinning) return;

    spinning = true;
    button.disabled = true;
    button.textContent = "🎰 БАРАБАНЫ КРУТЯТСЯ...";

   
try {
  document.getElementById("prizeResult").textContent =
    "🎰 Барабаны крутятся...";

  await Promise.all(reels.map(spinReel));

  document.getElementById("prizeResult").textContent =
    "🎁 Демонстрация завершена!";
} finally {
      spinning = false;
      button.disabled = false;
      button.textContent = "🎰 КРУТИТЬ ЕЩЁ";
    }
  });
 
lever.addEventListener("click", () => {
  if (spinning) return;

  lever.classList.remove("pulling");
  void lever.offsetWidth;
  lever.classList.add("pulling");

  button.click();
});


lever.addEventListener("animationend", (event) => {
  if (event.target !== lever.querySelector(".lever-stick")) {
    return;
  }

  lever.classList.remove("pulling");
});


</script>
</body>
</html>
